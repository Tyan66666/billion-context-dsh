name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `dist/` is committed so git-source installs work without a build step
      # (pnpm blocks dependency build scripts by default). Rebuild here and
      # fail if the committed artifacts differ from what the current source
      # produces — otherwise git installs would silently get stale code.
      #
      # Contributors do NOT rebuild dist/ by hand: the dist-bot workflow
      # (.github/workflows/dist-bot.yml) commits fresh artifacts to the PR
      # branch. On a fresh push this check is briefly red until the bot
      # lands; CI then re-runs green and the PR is mergeable. Fork PRs never
      # get a bot commit — the maintainer syncs dist/ on a same-repo branch
      # before merging.
      #
      # This comparison assumes deterministic builds across platforms: the
      # committed dist/ is built locally (macOS) while CI rebuilds on
      # ubuntu-latest. It holds because the toolchain is lockfile-pinned
      # (typescript / tsup / esbuild, acp-kernel 0.0.29 inlined) and the
      # sourcemap carries relative paths only. If a future toolchain change
      # introduces platform-dependent bytes or CRLF output, this check will
      # false-positive — treat that as a build-determinism regression to
      # investigate, not as stale artifacts.
      - name: Check committed dist matches the source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo '::error::dist/ drifted from source — the dist-bot should commit fresh artifacts to this PR branch automatically; if it cannot (e.g. a fork PR), run `npm run build` and commit them yourself'
            git status --short -- dist
            exit 1
          fi
