name: PR Title Suffix

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write

jobs:
  append-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Append (#N) to PR title if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          # Release titles stay exactly `release vX.Y.Z` (AGENTS.md §5).
          case "$PR_TITLE" in
            "release v"*) echo "release title — leave as is"; exit 0 ;;
          esac
          if [[ "$PR_TITLE" =~ \(#[0-9]+\)$ ]]; then
            echo "title already carries a PR ref — no change"
          else
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              -f "title=$PR_TITLE (#$PR_NUMBER)"
            echo "appended (#$PR_NUMBER)"
          fi
