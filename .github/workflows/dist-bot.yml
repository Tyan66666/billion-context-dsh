name: Dist Bot

# `dist/` is committed so git-source installs work without a build step
# (pnpm blocks dependency build scripts by default — issue #92). This bot
# frees contributors from rebuilding and committing `dist/` by hand: on any
# PR that can change the build output, it rebuilds and commits fresh
# artifacts to the PR branch, so every squash merge carries a `dist/` that
# matches its source. The CI drift check ("Check committed dist matches the
# source" in ci.yml) stays the merge gate — it may be briefly red on a fresh
# push and turns green once this bot lands its commit.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsup.config.ts'

permissions:
  contents: write

concurrency:
  group: dist-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-dist:
    # The bot's own push triggers a `synchronize` run; without this guard it
    # would loop forever (build is a no-op, but the run still costs minutes).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # Fork PRs get a read-only token, so the bot cannot push there. Leave a
      # loud marker and exit 0: the CI drift check stays red for such PRs,
      # which is the accurate signal that the maintainer must sync dist/ on a
      # same-repo branch before merging.
      - name: Skip fork pull requests
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo '::warning::dist-bot cannot push to fork PR branches (read-only token). If this PR changes the build output, sync dist/ on a same-repo branch before merging.'

      - uses: actions/checkout@v4
        with:
          # pull_request events default to the ephemeral merge ref; commit
          # the PR branch itself so the squash merge carries the fresh dist.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fresh dist to the PR branch
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo 'dist/ already matches the source — nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          git commit -m 'chore: sync dist/ build artifacts (dist-bot)'
          git push
