name: Dist Bot

# `dist/` is committed so git-source installs work without a build step
# (pnpm blocks dependency build scripts by default — issue #92). This bot
# keeps main's dist fresh WITHOUT touching contributor branches: after every
# merge that can change the build output, it rebuilds and, if the artifacts
# differ, pushes one dist commit directly to main. PR branches never carry
# dist, so contributors never pull bot commits and never resolve dist
# conflicts. Pushing to the protected main requires the bypass for the
# GitHub Actions app (app id 15368) on main's protection ruleset; humans are
# unaffected and still land everything via PRs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsup.config.ts'

permissions:
  contents: write

concurrency:
  group: dist-bot-main
  cancel-in-progress: true

jobs:
  sync-dist:
    # The bot's own dist commit is a push to main; without this guard it
    # would re-trigger this workflow forever.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fresh dist to main
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo 'dist/ already matches the source — nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          git commit -m "(chore) refresh dist/ after merge ${{ github.sha }} (dist-bot)"
          git push
